name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm test
      
    - name: Verify environment variables
      run: |
        echo "Checking if VITE_RAPIDAPI_KEY is set..."
        if [ -z "$VITE_RAPIDAPI_KEY" ]; then
          echo "❌ VITE_RAPIDAPI_KEY is not set or empty"
          exit 1
        else
          echo "✅ VITE_RAPIDAPI_KEY is set (length: ${#VITE_RAPIDAPI_KEY})"
        fi
      env:
        VITE_RAPIDAPI_KEY: ${{ secrets.VITE_RAPIDAPI_KEY }}
        
    - name: Build application
      run: npm run build
      env:
        VITE_RAPIDAPI_KEY: ${{ secrets.VITE_RAPIDAPI_KEY }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-files
        path: dist/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
